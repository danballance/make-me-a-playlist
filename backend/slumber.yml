name: make-me-a-playlist

# Profiles are groups of data you can easily switch between. A common usage is
# to define profiles for various environments of a REST service
profiles:
  local:
    name: Local
    data:
      host: http://localhost:8080


requests:
  todo_list:
    name: List items
    method: GET
    url: "/"
  todo_create:
    name: Create item
    method: POST
    url: "/"
    body:
      type: json
      data: { "title": "Item One", "done": false }

  session_create:
    name: Create playlist session
    method: POST
    url: "{{host}}/sessions"
    body:
      type: json
      data: { "topic": "advanced vim motions" }

  session_reply:
    name: Reply to playlist session
    method: POST
    url: "{{host}}/sessions/{{session_id}}/reply"
    body:
      type: json
      data: { "message": "I'm mostly interested in the tiny.nvim suite of plugins" }

  session_get:
    name: Get playlist session
    method: GET
    url: "{{host}}/sessions/{{session_id}}"

